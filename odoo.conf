[options]
; 相对路径基于项目根目录（start.sh 会先切到根目录再启动）
addons_path = odoo-19/addons,addons
data_dir = data

; ---- 数据库 ----
db_host = localhost
db_port = 5432
; 留空则使用当前系统用户，该用户需具备 createdb 权限（superuser）
; db_user = odoo
dbfilter = ^odoo19$

; ---- 网络 ----
http_port = 8069
http_interface = 127.0.0.1

; ---- 日志 ----
logfile = logs/odoo.log
log_level = info

; ---- 其它 ----
; 数据库主控密码：建议改成自己的随机值；留空则默认为 admin
; admin_passwd = change_me
list_db = True
workers = 0
max_cron_threads = 1
