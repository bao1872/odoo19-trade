# DEFERRED — NOT installed in the first deployment.
#
# Port 80 is currently occupied by an existing unrelated application
# 'lineagem' (nginx catch-all "server_name _" -> 301 -> :8001).
# Install this reverse-proxy config ONLY after port 80 is freed for Odoo,
# then switch Odoo to 127.0.0.1:8069 + proxy_mode=True.

server {
    listen 80 default_server;
    server_name 175.178.86.231 _;

    client_max_body_size 64m;
    proxy_read_timeout 600s;

    location / {
        proxy_pass http://127.0.0.1:8069;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
